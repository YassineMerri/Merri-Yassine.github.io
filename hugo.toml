[params]
  title = "Ahmed Yassine Merri"
  description = "Étudiant Ingénieur SESNUM à l'INPT"
  favicon = "/favicon.ico"

  [params.hero]
    enable = true
    intro = "Bonjour, je suis"
    title = "Merri Ahmed Yassine"
    subtitle = "Étudiant Ingénieur en Systèmes Embarqués & Services Numériques"
    content = "Passionné par l'électronique, les systèmes embarqués et l'innovation technologique. Étudiant en 1ère année cycle ingénieur à l'INPT (Institut National des Postes et Télécommunications), filière SESNUM."
    image = "/cvPhoto.jpeg" 

    [params.hero.button]
      enable = true
      name = "Mon CV"
      url = "/cv/mon-cv.pdf"
      download = true
      newPage = true

  [[params.hero.socialLinks.fontAwesomeIcons]]
    icon = "fab fa-github"
    url = "https://github.com/YassineMerri"

  [[params.hero.socialLinks.fontAwesomeIcons]]
    icon = "fab fa-linkedin"
    url = "https://www.linkedin.com/in/yassine-merri-65b840312?utm_source=share_via&utm_content=profile&utm_medium=member_ios"

  [params.about]
    enable = true
    title = "À propos de moi"
    image = "/cvPhoto.jpeg"
    content = """
Je suis étudiant en 1ère année du cycle ingénieur à l'**INPT - Institut National des Postes et Télécommunications** de Rabat, dans la filière **SESNUM (Systèmes Embarqués et Services Numériques)**.

Passionné par l'électronique, la programmation bas niveau et les nouvelles technologies, je cherche à acquérir des compétences solides en développement embarqué.
"""
    [params.about.skills]
      enable = true
      title = "Compétences techniques :"
      items = ["C / C++", "Python", "Arduino", "Raspberry Pi", "VHDL", "Linux", "Git", "MATLAB"]

  [params.experience]
  enable = true

  [[params.experience.items]]
    job = "Étudiant Ingénieur - SESNUM"
    company = "INPT"
    companyUrl = "https://www.inpt.ac.ma"
    date = "2025 - Présent"
    featuredLink = { enable = false }
    content = "Filière SESNUM — Systèmes Embarqués et Services Numériques. Formation en électronique, programmation embarquée, réseaux et systèmes numériques."

  [[params.experience.items]]
    job = "Classes Préparatoires - PSI"
    company = "Lycée Moulay Youssef"
    companyUrl = ""
    date = "2023 - 2025"
    featuredLink = { enable = false }
    content = "Classes préparatoires aux grandes écoles, filière Physique et Sciences de l'Ingénieur (PSI). Intégration à l'INPT par concours national commun."
 [params.education]
  enable = true

  [[params.education.items]]
